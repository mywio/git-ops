sonar.projectKey=mywio_git-ops
sonar.projectName=git-ops
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Analyze the whole repo, but classify only Go test files as tests.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclude generated, vendored-at-build, and runtime output paths.
sonar.exclusions=**/.git/**,**/.gocache/**,**/bin/**,**/frontend/dist/**,**/plugins/mcp/docs/**,**/coverage.out,**/report.json

# Coverage is produced separately with:
#   go test -covermode=atomic -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out

# Do not expect coverage for docs or generated/example-only scaffolding.
sonar.coverage.exclusions=**/*_test.go,**/*.md,docs/**,plugins/example/**
