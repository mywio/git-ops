core:
  token: "ghp_123..."
  users:
    - "myuser"
    - "myorg"
  topic: "homelab-server-1"
  target_dir: "./stacks"
  interval: "5m"
  dry_run: false
  plugins_dir: "./plugins"
  http_addr: "127.0.0.1:8080"

pushover:
  token: "push_token"
  user: "push_user"
  subscribe:
    - "notify_*"

webhook:
  url: "https://example.com/notify"
  subscribe:
    - "deploy_*"

webhook_trigger:
  port: "8082"
  token: "webhook_token"

mcp:
  api_key: "mcp_token"
  target_dir: "./stacks"

ui:
  disable_auth: false
  auth_header: "X-Auth-Request-User"
  # Recommended: verify the browser session directly with OAuth2 Proxy.
  auth_verify_url: "http://oauth2-proxy:4180/oauth2/auth"
  trust_auth_header: false

compose_refresh:
  enabled: true

google_secret_manager:
  project_id: "my-gcp-project"

env_forwarder:
  keys:
    - "SECRET_API_KEY"
    - "DB_PASSWORD"
  prefixes:
    - "APP_"

file_forwarder:
  files:
    - env: "TLS_CERT_FILE"
      path: "/etc/git-ops/tls/tls.crt"
      filename: "tls.crt"
      mode: "0600"
      required: true
