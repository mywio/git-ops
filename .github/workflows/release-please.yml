name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: |
          make build VERSION=${{ needs.release-please.outputs.tag_name }}
          make plugins
          make agent VERSION=${{ needs.release-please.outputs.tag_name }}
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/mywio/git-ops/pkg/core.Version=${{ needs.release-please.outputs.tag_name }}" -o bin/git-ops-agent-linux-arm64 ./cmd/git-ops-agent

      - name: Package artifacts
        run: |
          mkdir -p dist/plugins
          cp bin/git-ops dist/
          cp bin/git-ops-agent dist/git-ops-agent-linux-amd64
          cp bin/git-ops-agent-linux-arm64 dist/
          cp scripts/install-agent.sh dist/
          sha256sum dist/git-ops-agent-linux-amd64 dist/git-ops-agent-linux-arm64 > dist/SHA256SUMS
          cp bin/plugins/*.so dist/plugins/
          tar -czf /tmp/git-ops-linux-amd64.tar.gz -C dist .
          mv /tmp/git-ops-linux-amd64.tar.gz dist/

      - name: Attest agent artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/git-ops-agent-linux-amd64
            dist/git-ops-agent-linux-arm64
            dist/SHA256SUMS

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/git-ops-linux-amd64.tar.gz
            dist/git-ops-agent-linux-*
            dist/SHA256SUMS
            dist/install-agent.sh
